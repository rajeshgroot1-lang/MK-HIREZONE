<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Gallery — MK Hire Zone</title>
<link rel="stylesheet" href="style.css">
<style>
.company-gallery-page{max-width:1280px;margin:0 auto;padding:44px 5% 64px;}
.company-gallery-page h1{color:var(--primary);font-size:2rem;text-align:center;}
.company-gallery-page>.sub{text-align:center;margin:6px 0 28px;}
.company-gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;}
.public-gallery-card{overflow:hidden;margin:0;border:1px solid #e0e7f0;border-radius:10px;background:#fff;box-shadow:0 6px 20px rgba(17,42,74,.08);}
.public-gallery-card img{display:block;width:100%;height:240px;object-fit:cover;background:#f4f7fb;}
.gallery-image-button{display:block;width:100%;padding:0;border:0;background:transparent;cursor:zoom-in;}
.gallery-image-button:focus-visible{outline:3px solid #27a8ff;outline-offset:-3px;}
.public-gallery-card figcaption{padding:12px 14px 4px;color:var(--primary);font-weight:700;overflow-wrap:anywhere;}
.public-gallery-description{padding:0 14px 14px;color:#58677a;font-size:.9rem;overflow-wrap:anywhere;}
.company-gallery-empty{grid-column:1/-1;padding:24px;border:1px dashed #cbd5e1;border-radius:8px;color:#58677a;text-align:center;}
#galleryMessage{margin:20px 0;color:#b42318;text-align:center;font-weight:600;}
.gallery-viewer{width:min(96vw,1400px);max-width:none;height:96vh;max-height:none;margin:auto;padding:20px;border:0;border-radius:10px;background:#10141b;color:#fff;}
.gallery-viewer::backdrop{background:rgba(0,0,0,.88);}
.gallery-viewer-content{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;width:100%;height:100%;}
.gallery-viewer-close{justify-self:end;padding:8px 14px;border:1px solid #ffffff70;border-radius:6px;background:#ffffff18;color:#fff;font:inherit;font-weight:700;cursor:pointer;}
.gallery-viewer img{width:100%;height:100%;min-height:0;object-fit:contain;}
.gallery-viewer-caption{display:grid;gap:2px;text-align:center;overflow-wrap:anywhere;}
.gallery-viewer-caption p{color:#d0d5dd;}
@media(max-width:640px){.company-gallery-page{padding:28px 4% 42px}.company-gallery-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.public-gallery-card img{height:180px}}
</style></head><body>
<main class="company-gallery-page">
  <h1>Company Gallery</h1>
  <p class="sub">A look at our team, workplace and company activities.</p>
  <p id="galleryMessage" role="status" aria-live="polite"></p>
  <div id="companyGallery" class="company-gallery-grid"></div>
</main>
<dialog id="galleryViewer" class="gallery-viewer" aria-label="Full-screen company image">
  <div class="gallery-viewer-content">
    <button id="galleryViewerClose" class="gallery-viewer-close" type="button">Close</button>
    <img id="galleryViewerImage" alt="">
    <div class="gallery-viewer-caption">
      <strong id="galleryViewerName"></strong>
      <p id="galleryViewerDescription"></p>
    </div>
  </div>
</dialog>
<script src="app.js"></script>
<script src="gallery.js"></script>
</body></html>
